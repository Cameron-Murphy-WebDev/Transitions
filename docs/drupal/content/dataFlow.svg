<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="'JetBrains Mono', monospace">
  <defs>
    <marker id="head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9e64"/>
    </marker>
    <marker id="head-lavender" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a9b1d6"/>
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7aa2f7"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9ece6a"/>
    </marker>
  </defs>

  <!-- Blocks: where data is created or held -->
  <g fill="#29355a" stroke="#545c7e" stroke-width="1.5">
    <rect x="200" y="30" width="240" height="60" rx="8"/>
    <rect x="200" y="150" width="240" height="60" rx="8"/>
    <rect x="200" y="270" width="240" height="60" rx="8"/>
    <rect x="200" y="390" width="240" height="60" rx="8"/>
    <rect x="200" y="510" width="240" height="60" rx="8"/>
    <rect x="520" y="270" width="180" height="60" rx="8"/>
  </g>
  <g text-anchor="middle">
    <g fill="#c0caf5" font-size="14" font-weight="700">
      <text x="320" y="55">Editor</text>
      <text x="320" y="175">Drupal database</text>
      <text x="320" y="295">Drupal PHP</text>
      <text x="320" y="415">Page HTML</text>
      <text x="320" y="535">React</text>
      <text x="610" y="295">Media entity</text>
    </g>
    <g fill="#a9b1d6" font-size="11">
      <text x="320" y="75">.definition.js → setAttributes</text>
      <text x="320" y="195">node body field</text>
      <text x="320" y="315">node_view_alter · resolve IDs</text>
      <text x="320" y="435">data-blocks JSON + Twig</text>
      <text x="320" y="555">GutenbergBlockParser</text>
      <text x="610" y="315">current URL / alt</text>
    </g>
  </g>

  <!-- Arrows: the data flow -->
  <g fill="none" stroke-width="2.5">
    <!-- Author saves -->
    <line x1="280" y1="92" x2="280" y2="146" stroke="#ff9e64" marker-end="url(#head-orange)"/>
    <!-- Edit form reloads saved attributes -->
    <line x1="360" y1="148" x2="360" y2="94" stroke="#a9b1d6" stroke-dasharray="6 4" marker-end="url(#head-lavender)"/>
    <!-- Visitor request chain -->
    <line x1="320" y1="212" x2="320" y2="266" stroke="#7aa2f7" marker-end="url(#head-blue)"/>
    <line x1="320" y1="332" x2="320" y2="386" stroke="#7aa2f7" marker-end="url(#head-blue)"/>
    <line x1="320" y1="452" x2="320" y2="506" stroke="#7aa2f7" marker-end="url(#head-blue)"/>
    <!-- IDs resolved against current entity data -->
    <line x1="518" y1="300" x2="444" y2="300" stroke="#9ece6a" marker-end="url(#head-green)"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="11">
    <g fill="#ff9e64" text-anchor="end">
      <text x="268" y="116">save</text>
      <text x="268" y="132">attrs in &lt;!-- wp: --&gt; comments</text>
    </g>
    <g fill="#a9b1d6">
      <text x="372" y="116">open edit form</text>
      <text x="372" y="132">comments → attributes</text>
    </g>
    <g fill="#7aa2f7">
      <text x="334" y="236">visitor request</text>
      <text x="334" y="252">parse body → block tree</text>
      <text x="334" y="356">block tree as JSON</text>
      <text x="334" y="372">+ Twig fallback markup</text>
      <text x="334" y="476">Drupal behavior</text>
      <text x="334" y="492">reads JSON, mounts blocks</text>
    </g>
    <g fill="#9ece6a" text-anchor="middle">
      <text x="610" y="350">mid → fresh data</text>
    </g>
  </g>
</svg>
